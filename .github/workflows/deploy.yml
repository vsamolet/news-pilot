name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Вызывается вручную из news-cron.yml после публикации новой статьи —
  # обычный push бота идёт через встроенный GITHUB_TOKEN, а такие пуши
  # GitHub Actions намеренно НЕ триггерит для других workflow (защита от
  # рекурсии), поэтому news-cron.yml дёргает этот workflow_dispatch напрямую
  # через API вместо того, чтобы полагаться на триггер push.

permissions:
  contents: read

# Гарантируем, что билд+деплой не пересекаются — иначе можно случайно
# перезаписать более свежий деплой более старым, если два запуска пойдут
# почти одновременно (например, ручной пуш и автопубликация подряд).
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        # Жёсткая проверка вместо слепого доверия: если dist/ пустой или
        # подозрительно маленький, job должен упасть здесь с понятной
        # ошибкой — а не молча уйти на wrangler deploy с неполными файлами.
        run: |
          count=$(find dist -type f | wc -l)
          echo "Файлов в dist/: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::В dist/ всего $count файлов — похоже, npm run build не отработал как надо."
            exit 1
          fi
          test -d dist/news || { echo "::error::dist/news/ отсутствует — статьи не собрались."; exit 1; }
          echo "OK: dist/ содержит $count файлов, dist/news/ на месте."

      - name: Deploy to Cloudflare Workers (100% трафика)
        # Обычный `wrangler deploy` (не `versions upload`) сразу отправляет
        # 100% трафика на новую версию — никакого gradual rollout здесь нет.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
