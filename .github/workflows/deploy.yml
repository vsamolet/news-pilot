name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Вызывается вручную из news-cron.yml после публикации новой статьи —
  # обычный push бота идёт через встроенный GITHUB_TOKEN, а такие пуши
  # GitHub Actions намеренно НЕ триггерит для других workflow (защита от
  # рекурсии), поэтому news-cron.yml дёргает этот workflow_dispatch напрямую
  # через API вместо того, чтобы полагаться на триггер push.

permissions:
  contents: read

# Гарантируем, что билд+деплой не пересекаются — иначе можно случайно
# перезаписать более свежий деплой более старым, если два запуска пойдут
# почти одновременно (например, ручной пуш и автопубликация подряд).
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers (100% трафика)
        # Обычный `wrangler deploy` (не `versions upload`) сразу отправляет
        # 100% трафика на новую версию — никакого gradual rollout здесь нет.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
