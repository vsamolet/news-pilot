name: News pipeline

on:
  schedule:
    # 06:00, 12:00, 18:00 UTC — 3 запуска в день. При --max-per-run 1 (по
    # умолчанию в pipeline.py) это даёт ~90 статей в месяц.
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: {}

# Нужны права на запись, чтобы шаг commit/push ниже мог закоммитить новые
# статьи и изображения обратно в репозиторий от имени github-actions[bot].
permissions:
  contents: write

# Не даём двум запускам (например, cron и ручному тесту одновременно)
# конфликтовать при пуше — второй просто дождётся первого в очереди.
concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Бэкстоп на весь job (checkout/setup-python/pip install тоже теоретически
    # могут зависнуть) — отдельно от timeout-minutes на шаге пайплайна ниже.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Полная история (не мелкий fetch-depth:1 по умолчанию) — без неё
          # `git pull --rebase`/явный checkout ветки ниже не имеет опоры и
          # шаг коммита падает с "Updates were rejected". Заодно checkout
          # переключается на реальную ветку main вместо detached HEAD.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news pipeline
        # pipeline.py сам себя ограничивает (REQUEST_TIMEOUT=20с на запрос,
        # MAX_ATTEMPTS_PER_RUN=5 кандидатов), так что в норме проход занимает
        # секунды-десятки секунд — 5 минут тут чисто аварийный потолок.
        timeout-minutes: 5
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python pipeline.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Забираем актуальное состояние origin/main и явно переключаемся на
          # ветку (checkout@v4 при обычном запуске оставляет detached HEAD —
          # без этого шага пуш ниже не знает, в какую ветку он метит).
          git fetch origin main
          git checkout main

          git add src/content/news/ public/images/ history.json publish_log.json

          if ! git diff --staged --quiet; then
            git commit -m "Автопубликация новостей ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # На случай, если main за время работы пайплайна успел уйти вперёд
            # (параллельный запуск, ручной пуш и т.п.) — подтягиваем и ребейзим
            # наш коммит поверх свежего HEAD перед пушем.
            git pull --rebase origin main
            git push origin main
          else
            echo "Нет новых файлов для публикации"
          fi
